<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tailwind-superellipse demo</title>
<style>
/* CSS */
body { font: 14px/1.5 system-ui, sans-serif; margin: 32px; background: #fff; color: #222; }
h2 { margin: 32px 0 8px; font-size: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
figure { margin: 0; text-align: center; font-size: 12px; }
.box { width: 140px; height: 140px; background: #4f46e5; color: #fff; display: grid; place-items: center; margin-bottom: 6px; }
.note { color: #666; max-width: 640px; }
</style>
</head>
<body>
<h1>tailwind-superellipse</h1>
<p id="support" class="note"></p>
<script>
document.getElementById('support').textContent = CSS.supports('corner-shape', 'superellipse(1.5)')
  ? '✅ このブラウザは corner-shape に対応しています'
  : '⚠️ このブラウザは corner-shape 非対応です。下の squircle は通常の角丸になります（Chrome / Edge 139 以降で確認してください）。';
</script>

<h2>1. rounded と squircle（同じ xl）</h2>
<div class="row">
  <figure><div class="box rounded-xl">rounded-xl</div>rounded-xl</figure>
  <figure><div class="box squircle-xl">squircle-xl</div>squircle-xl（既定: 指数 1.5・半径 1.5 倍）</figure>
</div>

<h2>2. 指数の比較（--superellipse-exponent）</h2>
<div class="row">
  <figure><div class="box squircle-xl" style="--superellipse-exponent:1">squircle-xl</div>1（通常の丸）</figure>
  <figure><div class="box squircle-xl" style="--superellipse-exponent:1.5">squircle-xl</div>1.5（既定）</figure>
  <figure><div class="box squircle-xl" style="--superellipse-exponent:2">squircle-xl</div>2（CSS の squircle）</figure>
  <figure><div class="box squircle-xl" style="--superellipse-exponent:3">squircle-xl</div>3</figure>
</div>

<h2>3. 半径の補正（--superellipse-scale）</h2>
<div class="row">
  <figure><div class="box squircle-xl" style="--superellipse-scale:1">squircle-xl</div>scale 1</figure>
  <figure><div class="box squircle-xl">squircle-xl</div>scale 1.5（既定）</figure>
  <figure><div class="box squircle-xl" style="--superellipse-scale:2">squircle-xl</div>scale 2</figure>
</div>

<h2>4. サイズ</h2>
<div class="row">
  <figure><div class="box squircle-sm">sm</div>squircle-sm</figure>
  <figure><div class="box squircle-md">md</div>squircle-md</figure>
  <figure><div class="box squircle-lg">lg</div>squircle-lg</figure>
  <figure><div class="box squircle-2xl">2xl</div>squircle-2xl</figure>
  <figure><div class="box squircle-4xl">4xl</div>squircle-4xl</figure>
  <figure><div class="box squircle-[32px]">[32px]</div>squircle-[32px]</figure>
</div>

<h2>5. 辺・角・none・full</h2>
<div class="row">
  <figure><div class="box squircle-t-2xl">t</div>squircle-t-2xl</figure>
  <figure><div class="box squircle-tl-4xl">tl</div>squircle-tl-4xl</figure>
  <figure><div class="box squircle-2xl squircle-br-none">br-none</div>squircle-2xl squircle-br-none</figure>
  <figure><div class="box squircle-none">none</div>squircle-none</figure>
  <figure><div class="box squircle-full">full</div>squircle-full</figure>
</div>
</body>
</html>
